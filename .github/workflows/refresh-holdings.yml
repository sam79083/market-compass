name: Refresh ETF holdings

# Daily (including weekends) refresh of the top-10 ETF holdings shown in the
# frontend. Commits only when Yahoo actually changed something, so most days
# this produces no commit. The weekday market-data refresh also runs this.
on:
  schedule:
    - cron: "20 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-etf-holdings
  cancel-in-progress: false

jobs:
  holdings:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Fetch ETF top-10 holdings (unofficial Yahoo topHoldings)
        # Best effort: a failure just keeps the previous snapshot.
        continue-on-error: true
        run: |
          pip install requests
          python scripts/fetch_etf_holdings.py --out data/etf_holdings.json \
            --static-out frontend/public/data/etf-holdings.json

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/etf_holdings.json frontend/public/data/etf-holdings.json
          if git diff --cached --quiet; then
            echo "No holdings changes"
          else
            git commit -m "chore: refresh ETF holdings"
            git push
          fi
