name: Refresh market data

on:
  schedule:
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      forward_pe_since:
        description: "Backfill forward P/E from this date (YYYY-MM-DD). Leave empty for the last 21 days."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh-market-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Fetch forward P/E from FactSet Earnings Insight
        # A parser or network failure must not block the rest of the daily refresh.
        continue-on-error: true
        env:
          SINCE: ${{ github.event.inputs.forward_pe_since }}
        run: |
          pip install requests pypdf
          if [ -n "$SINCE" ]; then
            python scripts/fetch_forward_pe.py --out data/forward_pe.csv --since "$SINCE"
          else
            python scripts/fetch_forward_pe.py --out data/forward_pe.csv
          fi

      - name: Fetch Fear & Greed history (unofficial CNN endpoint)
        # Best effort: if it fails, Fear & Greed just stays unavailable for this run.
        continue-on-error: true
        run: |
          pip install requests
          python scripts/fetch_fear_greed.py --out data/fear_greed.csv

      - name: Record today's NASDAQ-100 trailing P/E
        # No free source has NASDAQ-100 earnings history, so one snapshot is added per run.
        # Best effort: a failure just skips today's row.
        continue-on-error: true
        run: python scripts/fetch_nasdaq_pe.py --out data/nasdaq_pe.csv

      - name: Restore observation cache
        uses: actions/cache@v4
        with:
          path: backend/data/valuation.db
          key: valuation-db-${{ github.run_id }}
          restore-keys: |
            valuation-db-

      - name: Refresh and export snapshots
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///./data/valuation.db
          ALLOW_UNOFFICIAL_PRICE_FEED: "true"
          BREADTH_ENABLED: "true"
          # "trailing" keeps the long earnings-yield history. "auto" switches to forward P/E,
          # whose CSV is short and truncates ERP (and the composite history) to ~2022 onward.
          ERP_METHOD: trailing
          # A FORWARD_PE_CSV_URL secret, if set, overrides the file fetched above.
          FORWARD_PE_CSV_URL: ${{ secrets.FORWARD_PE_CSV_URL || format('file://{0}/data/forward_pe.csv', github.workspace) }}
          NASDAQ_PE_CSV_URL: ${{ format('file://{0}/data/nasdaq_pe.csv', github.workspace) }}
          # A FEAR_GREED_CSV_URL secret, if set, overrides the file fetched above.
          FEAR_GREED_CSV_URL: ${{ secrets.FEAR_GREED_CSV_URL || format('file://{0}/data/fear_greed.csv', github.workspace) }}
        run: |
          python -m app.cli refresh --validate
          python -m app.cli export-static --out ../frontend/public/data

      - name: Commit refreshed snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data
          if [ -f data/forward_pe.csv ]; then git add data/forward_pe.csv; fi
          if [ -f data/fear_greed.csv ]; then git add data/fear_greed.csv; fi
          if [ -f data/nasdaq_pe.csv ]; then git add data/nasdaq_pe.csv; fi
          if git diff --cached --quiet; then
            echo "No snapshot changes"
          else
            git commit -m "chore: refresh market data"
            git push
          fi
